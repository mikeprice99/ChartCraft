[package]
name = "diagrammer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ChartCraft"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
egui = "0.37"
epaint_default_fonts = "0.37"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "native-tls"] }
rfd = "0.18.0"
roxmltree = "0.21.2"
serde_json = "1.0.154"
tiny-skia = "0.12.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
